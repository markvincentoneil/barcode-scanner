<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Barcode Scanner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1419" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Barcode Scanner v1</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e8eef4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
      --border: #2d3a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      line-height: 1.45;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 6px;
    }
    .app-header h1 {
      font-size: 1.35rem;
      margin: 0;
      flex: 1;
      min-width: 0;
    }
    .version-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .scanner-wrap {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      height: 110px;
    }
    #reader {
      overflow: hidden;
      height: 110px;
      line-height: 0;
    }
    #reader video {
      display: block !important;
      width: 100% !important;
      height: 110px !important;
      min-height: 0 !important;
      max-height: 110px !important;
      object-fit: contain !important;
      object-position: center center;
    }
    #reader__dashboard,
    #reader__header_message,
    #reader__camera_selection,
    #reader__filescan_input {
      display: none !important;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-capture {
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: #fff;
    }
    .btn-secondary { background: #374151; color: var(--text); }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-row .btn { margin-top: 0; }
    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
    }
    .status.info { background: #1e3a5f; color: #bfdbfe; }
    .status.ok { background: #14532d; color: #bbf7d0; }
    .status.warn { background: #78350f; color: #fde68a; }
    .status.err { background: #7f1d1d; color: #fecaca; }
    .hidden { display: none !important; }
    .count-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ok);
    }
    ul.scan-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 280px;
      overflow-y: auto;
    }
    ul.scan-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.95rem;
    }
    ul.scan-list li span.idx {
      color: var(--muted);
      min-width: 1.5rem;
    }
    ul.scan-list li span.code { flex: 1; word-break: break-all; }
    ul.scan-list button {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
    }
    footer { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }

    .capture-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 10000;
    }

    .capture-flash.run {
      animation: captureFlash 0.4s ease-out forwards;
    }

    @keyframes captureFlash {
      0% { opacity: 0; }
      12% { opacity: 0.92; }
      100% { opacity: 0; }
    }

    .field-gap { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>Barcode Scanner</h1>
    <span id="appVersionBadge" class="version-badge" aria-label="App version">v1.0.10</span>
  </div>
  <p class="subtitle">Scan asset tags in a room, then export a text list for your computer.</p>

  <div class="card">
    <label for="schoolName">School</label>
    <input type="text" id="schoolName" placeholder="e.g. Abbotsford School District" autocomplete="off" />
    <label for="roomName" class="field-gap">Room</label>
    <input type="text" id="roomName" placeholder="e.g. Lab 204, Cart A" autocomplete="off" />

    <div id="captureFlash" class="capture-flash" aria-hidden="true"></div>
    <div class="scanner-wrap hidden" id="scannerWrap">
      <div id="reader"></div>
    </div>

    <button type="button" class="btn btn-primary" id="btnStart">Start camera</button>
    <button type="button" class="btn btn-capture hidden" id="btnCapture">Scan now</button>
    <button type="button" class="btn btn-secondary hidden" id="btnStop">Stop camera</button>
    <div id="scanStatus" class="status info hidden"></div>
  </div>

  <div class="card">
    <p>Scanned: <span class="count-badge" id="scanCount">0</span></p>
    <ul class="scan-list" id="scanList"></ul>
    <p id="emptyHint" class="subtitle" style="margin: 12px 0 0;">No barcodes yet — start the camera and scan device tags.</p>

    <label for="manualCode" style="margin-top: 14px;">Type code manually</label>
    <input type="text" id="manualCode" placeholder="Paste or type asset tag" autocomplete="off" />
    <button type="button" class="btn btn-secondary" id="btnAddManual">Add to list</button>
  </div>

  <div class="card">
    <strong style="font-size: 0.95rem;">Export</strong>
    <button type="button" class="btn btn-primary" id="btnCopy">Copy report to clipboard</button>
    <button type="button" class="btn btn-secondary" id="btnDownload">Download .txt file</button>
    <button type="button" class="btn btn-secondary" id="btnShare">Share / AirDrop</button>
    <button type="button" class="btn btn-secondary" id="btnEmail">Email list to myself</button>
    <div id="exportStatus" class="status hidden"></div>
    <div class="btn-row" style="margin-top: 12px;">
      <button type="button" class="btn btn-danger" id="btnClear">Clear all</button>
      <button type="button" class="btn btn-secondary" id="btnUndo">Remove last</button>
    </div>
  </div>

  <footer>v<span id="appVersion">1.0.10</span> · HTTPS required for camera · List saved on this device until you clear it</footer>

  <audio id="shutterAudio" preload="auto" playsinline></audio>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script>
    const APP_VERSION = "1.0.10";
    const TARGET_CAMERA_ZOOM = 2;
    const STORAGE_KEY = "barcode-scanner-v1-session";
    const DEFAULT_SCHOOL = "Abbotsford School District";
    const AUTO_SCAN_INTERVAL_MS = 300;
    const AUTO_SCAN_MATCHES = 2;
    const AUTO_SCAN_SHARPNESS_MIN = 22;

    const schoolName = document.getElementById("schoolName");
    const roomName = document.getElementById("roomName");
    const captureFlash = document.getElementById("captureFlash");
    const scannerWrap = document.getElementById("scannerWrap");
    const btnStart = document.getElementById("btnStart");
    const btnCapture = document.getElementById("btnCapture");
    const btnStop = document.getElementById("btnStop");
    const scanStatus = document.getElementById("scanStatus");
    const scanCount = document.getElementById("scanCount");
    const scanList = document.getElementById("scanList");
    const emptyHint = document.getElementById("emptyHint");
    const manualCode = document.getElementById("manualCode");
    const btnAddManual = document.getElementById("btnAddManual");
    const btnCopy = document.getElementById("btnCopy");
    const btnDownload = document.getElementById("btnDownload");
    const btnShare = document.getElementById("btnShare");
    const btnEmail = document.getElementById("btnEmail");
    const btnClear = document.getElementById("btnClear");
    const btnUndo = document.getElementById("btnUndo");
    const exportStatus = document.getElementById("exportStatus");

    let scanner = null;
    let isScanning = false;
    let codes = [];
    let lastAdded = null;
    let lastAddedAt = 0;
    const DEDUPE_MS = 2000;
    const shutterAudio = document.getElementById("shutterAudio");
    let shutterAudioReady = false;
    let audioCtx = null;
    let shutterClickBuffer = null;
    let autoScanTimer = null;
    let autoScanBusy = false;
    let autoScanStreak = { code: null, count: 0 };

    function showStatus(el, msg, type) {
      el.textContent = msg;
      el.className = "status " + type;
      el.classList.remove("hidden");
    }

    function hideStatus(el) {
      el.classList.add("hidden");
    }

    function normalizeCode(raw) {
      return String(raw || "").trim();
    }

    function saveSession() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            school: schoolName.value.trim(),
            room: roomName.value.trim(),
            codes: codes.slice(),
            at: Date.now(),
          })
        );
      } catch (e) {
        console.warn("saveSession", e);
      }
    }

    function loadSession() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.school) schoolName.value = data.school;
        else if (!schoolName.value.trim()) schoolName.value = DEFAULT_SCHOOL;
        if (data.room) roomName.value = data.room;
        if (Array.isArray(data.codes)) codes = data.codes.map(normalizeCode).filter(Boolean);
      } catch (e) {
        console.warn("loadSession", e);
      }
    }

    function renderList() {
      scanCount.textContent = String(codes.length);
      emptyHint.classList.toggle("hidden", codes.length > 0);
      scanList.innerHTML = codes
        .map(function (code, i) {
          return (
            '<li><span class="idx">' +
            (i + 1) +
            '.</span><span class="code">' +
            escapeHtml(code) +
            '</span><button type="button" data-i="' +
            i +
            '">Remove</button></li>'
          );
        })
        .join("");

      scanList.querySelectorAll("button[data-i]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const idx = parseInt(btn.getAttribute("data-i"), 10);
          if (idx >= 0 && idx < codes.length) {
            codes.splice(idx, 1);
            saveSession();
            renderList();
          }
        });
      });
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function triggerCaptureFlash() {
      captureFlash.classList.remove("run");
      void captureFlash.offsetWidth;
      captureFlash.classList.add("run");
      setTimeout(function () {
        captureFlash.classList.remove("run");
      }, 450);
    }

    function waitMs(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    function ensureAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      return audioCtx;
    }

    function buildShutterClickBuffer(ctx) {
      const duration = 0.09;
      const sampleRate = ctx.sampleRate;
      const length = Math.floor(sampleRate * duration);
      const buffer = ctx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 42);
        const noise = (Math.random() * 2 - 1) * 0.5;
        const tone = Math.sin(2 * Math.PI * 2200 * t) * Math.exp(-t * 70) * 0.3;
        data[i] = (noise + tone) * env;
      }
      return buffer;
    }

    function playWebAudioShutter() {
      const ctx = ensureAudioContext();
      if (!ctx || !shutterAudioReady || !shutterClickBuffer) return false;
      try {
        if (ctx.state === "suspended") void ctx.resume();
        const src = ctx.createBufferSource();
        src.buffer = shutterClickBuffer;
        const gain = ctx.createGain();
        gain.gain.value = 0.95;
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start(0);
        return true;
      } catch (e) {
        console.debug("playWebAudioShutter", e);
        return false;
      }
    }

    function playHtmlShutterSound() {
      if (!shutterAudio || !shutterAudio.src) return;
      try {
        shutterAudio.muted = false;
        shutterAudio.volume = 1;
        shutterAudio.currentTime = 0;
        const playPromise = shutterAudio.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function (e) {
            console.debug("playHtmlShutterSound", e);
          });
        }
      } catch (e) {
        console.debug("playHtmlShutterSound", e);
      }
    }

    async function unlockShutterAudio() {
      if (shutterAudioReady) return;
      const ctx = ensureAudioContext();
      if (ctx) {
        try {
          if (ctx.state === "suspended") await ctx.resume();
          if (!shutterClickBuffer) shutterClickBuffer = buildShutterClickBuffer(ctx);
          shutterAudioReady = true;
        } catch (e) {
          console.debug("unlock web audio", e);
        }
      }
      if (!shutterAudio || shutterAudio.src) return;
      try {
        shutterAudio.src = "./shutter.mp3";
        shutterAudio.volume = 1;
        shutterAudio.muted = true;
        const playPromise = shutterAudio.play();
        if (playPromise && typeof playPromise.then === "function") {
          await Promise.race([playPromise, waitMs(400)]);
        }
        shutterAudio.pause();
        shutterAudio.currentTime = 0;
        shutterAudio.muted = false;
        shutterAudioReady = true;
      } catch (e) {
        console.debug("unlock html audio", e);
        if (ctx && shutterClickBuffer) shutterAudioReady = true;
      }
    }

    function playShutterSound() {
      if (!playWebAudioShutter()) playHtmlShutterSound();
    }

    function feedbackAutoScan() {
      triggerCaptureFlash();
      playShutterSound();
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
    }

    function addCode(raw, options) {
      const opts = options || {};
      const code = normalizeCode(raw);
      if (!code) {
        showStatus(scanStatus, "Empty code — scan again or type a value.", "warn");
        return false;
      }

      const now = Date.now();
      if (code === lastAdded && now - lastAddedAt < DEDUPE_MS) {
        return false;
      }
      lastAdded = code;
      lastAddedAt = now;

      if (codes.indexOf(code) >= 0) {
        showStatus(scanStatus, "Already in list: " + code, "warn");
        if (navigator.vibrate) navigator.vibrate(40);
        return false;
      }

      codes.push(code);
      saveSession();
      renderList();
      showStatus(scanStatus, "Added: " + code, "ok");
      if (opts.auto) {
        feedbackAutoScan();
      }
      return true;
    }

    function buildExportText() {
      const school = schoolName.value.trim();
      const room = roomName.value.trim();
      const lines = [];
      const date = new Date().toLocaleString();
      if (school) lines.push("School: " + school);
      if (room) lines.push("Room: " + room);
      lines.push("Date: " + date);
      lines.push("Count: " + codes.length);
      lines.push("");
      codes.forEach(function (c) {
        lines.push(c);
      });
      return lines.join("\n");
    }

    function exportSubjectLabel() {
      const school = schoolName.value.trim();
      const room = roomName.value.trim();
      if (school && room) return school + " — " + room;
      if (school) return school;
      if (room) return room;
      return "Device scan";
    }

    function safeFilename() {
      const school = schoolName.value.trim();
      const room = roomName.value.trim();
      const parts = ["devices"];
      if (school) parts.push(school);
      if (room) parts.push(room);
      const safe = parts
        .join("-")
        .replace(/[^a-zA-Z0-9-_]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      const d = new Date().toISOString().slice(0, 10);
      return (safe || "scan") + "-" + d + ".txt";
    }

    async function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    function resetAutoScanStreak() {
      autoScanStreak = { code: null, count: 0 };
    }

    function stopAutoScan() {
      if (autoScanTimer) {
        clearInterval(autoScanTimer);
        autoScanTimer = null;
      }
      autoScanBusy = false;
      resetAutoScanStreak();
    }

    function startAutoScan() {
      stopAutoScan();
      autoScanTimer = setInterval(function () {
        void tryAutoScanTick();
      }, AUTO_SCAN_INTERVAL_MS);
    }

    function measureSharpness(canvas) {
      const sw = 120;
      const sh = 80;
      const small = document.createElement("canvas");
      small.width = sw;
      small.height = sh;
      const ctx = small.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(canvas, 0, 0, sw, sh);
      const data = ctx.getImageData(0, 0, sw, sh).data;
      let sum = 0;
      let sumSq = 0;
      let n = 0;

      for (let y = 1; y < sh - 1; y++) {
        for (let x = 1; x < sw - 1; x++) {
          const i = (y * sw + x) * 4;
          const c = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          const iu = ((y - 1) * sw + x) * 4;
          const id = ((y + 1) * sw + x) * 4;
          const il = (y * sw + (x - 1)) * 4;
          const ir = (y * sw + (x + 1)) * 4;
          const up = 0.299 * data[iu] + 0.587 * data[iu + 1] + 0.114 * data[iu + 2];
          const dn = 0.299 * data[id] + 0.587 * data[id + 1] + 0.114 * data[id + 2];
          const lf = 0.299 * data[il] + 0.587 * data[il + 1] + 0.114 * data[il + 2];
          const rt = 0.299 * data[ir] + 0.587 * data[ir + 1] + 0.114 * data[ir + 2];
          const lap = Math.abs(4 * c - up - dn - lf - rt);
          sum += lap;
          sumSq += lap * lap;
          n++;
        }
      }

      if (n === 0) return 0;
      const mean = sum / n;
      return sumSq / n - mean * mean;
    }

    async function tryAutoScanTick() {
      if (!isScanning || !scanner || autoScanBusy || btnCapture.disabled) return;

      const video = getScannerVideo();
      if (!video || !video.videoWidth) return;

      autoScanBusy = true;
      try {
        const canvas = frameToCanvas(video, false);
        if (measureSharpness(canvas) < AUTO_SCAN_SHARPNESS_MIN) {
          resetAutoScanStreak();
          return;
        }

        const decoded = await decodeCanvasWithZxing(canvas);
        const code = normalizeCode(decoded);
        if (!code) {
          resetAutoScanStreak();
          return;
        }

        if (autoScanStreak.code === code) {
          autoScanStreak.count += 1;
        } else {
          autoScanStreak = { code: code, count: 1 };
        }

        if (autoScanStreak.count >= AUTO_SCAN_MATCHES) {
          resetAutoScanStreak();
          addCode(code, { auto: true });
        }
      } catch (e) {
        console.debug("auto-scan tick", e);
      } finally {
        autoScanBusy = false;
      }
    }

    function onScanSuccess(decodedText) {
      const code = normalizeCode(decodedText);
      if (!code) return;

      if (autoScanStreak.code === code) {
        autoScanStreak.count += 1;
      } else {
        autoScanStreak = { code: code, count: 1 };
      }

      if (autoScanStreak.count < AUTO_SCAN_MATCHES) return;

      resetAutoScanStreak();
      addCode(code, { auto: true });
    }

    function getScannerVideo() {
      return document.querySelector("#reader video");
    }

    function extractDecodedText(result) {
      if (!result) return null;
      if (typeof result === "string") return result;
      if (typeof result.decodedText === "string") return result.decodedText;
      return null;
    }

    function frameToCanvas(video, cropCenter) {
      const canvas = document.createElement("canvas");
      if (!cropCenter) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas;
      }
      const cropW = Math.floor(video.videoWidth * 0.75);
      const cropH = Math.floor(video.videoHeight * 0.35);
      const sx = Math.floor((video.videoWidth - cropW) / 2);
      const sy = Math.floor((video.videoHeight - cropH) / 2);
      canvas.width = cropW;
      canvas.height = cropH;
      canvas.getContext("2d").drawImage(video, sx, sy, cropW, cropH, 0, 0, cropW, cropH);
      return canvas;
    }

    async function decodeCanvasWithZxing(canvas) {
      if (typeof ZXing === "undefined") return null;
      const formats = [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.DATA_MATRIX,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
      ];
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      const img = new Image();
      img.src = canvas.toDataURL("image/png");
      await new Promise(function (resolve, reject) {
        img.onload = resolve;
        img.onerror = reject;
      });

      const reader = new ZXing.BrowserMultiFormatReader(hints);
      try {
        const result = await reader.decodeFromImageElement(img);
        return result ? result.getText() : null;
      } catch (e) {
        return null;
      }
    }

    async function decodeSnapshotFromCanvas(canvas) {
      const blob = await new Promise(function (resolve) {
        canvas.toBlob(resolve, "image/jpeg", 0.95);
      });
      if (!blob) return null;

      const file = new File([blob], "barcode-snapshot.jpg", { type: "image/jpeg" });

      if (scanner && typeof scanner.pause === "function") {
        try {
          await scanner.pause(true);
        } catch (e) {
          console.debug("pause", e);
        }
      }

      try {
        if (scanner && typeof scanner.scanFileV2 === "function") {
          const r = await scanner.scanFileV2(file, false);
          const text = extractDecodedText(r);
          if (text) return text;
        }
        if (scanner && typeof scanner.scanFile === "function") {
          const r = await scanner.scanFile(file, false);
          const text = extractDecodedText(r);
          if (text) return text;
        }
      } catch (e) {
        console.debug("html5-qrcode file scan", e);
      }

      return decodeCanvasWithZxing(canvas);
    }

    async function captureAndScan() {
      if (!scanner || !isScanning) {
        showStatus(scanStatus, "Start the camera first.", "warn");
        return;
      }

      const video = getScannerVideo();
      if (!video || !video.videoWidth) {
        showStatus(scanStatus, "Camera still loading — wait a moment and try again.", "warn");
        return;
      }

      showStatus(scanStatus, "Capturing…", "info");
      btnCapture.disabled = true;

      try {
        let decoded = await decodeSnapshotFromCanvas(frameToCanvas(video, false));
        if (!decoded) {
          decoded = await decodeSnapshotFromCanvas(frameToCanvas(video, true));
        }
        if (!decoded) {
          showStatus(
            scanStatus,
            "No barcode in that shot — center the tag, hold steady, then tap Scan now again.",
            "warn"
          );
          return;
        }
        addCode(decoded);
      } catch (e) {
        console.warn(e);
        showStatus(
          scanStatus,
          "Could not read the barcode. Center the tag and tap Scan now again.",
          "warn"
        );
      } finally {
        btnCapture.disabled = false;
        if (scanner && typeof scanner.resume === "function") {
          try {
            await scanner.resume();
          } catch (e) {
            console.debug("resume", e);
          }
        }
      }
    }

    function clearReaderElement() {
      const readerEl = document.getElementById("reader");
      if (readerEl) readerEl.innerHTML = "";
    }

    function buildCameraRequest(facingMode) {
      return {
        facingMode: facingMode,
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      };
    }

    async function applyPreferredZoom() {
      const video = getScannerVideo();
      const track = video && video.srcObject && video.srcObject.getVideoTracks()[0];
      if (track && typeof track.getCapabilities === "function") {
        const caps = track.getCapabilities();
        if (caps.zoom) {
          const z = Math.min(
            caps.zoom.max,
            Math.max(caps.zoom.min, TARGET_CAMERA_ZOOM)
          );
          const tries = [{ advanced: [{ zoom: z }] }, { zoom: z }];
          for (let i = 0; i < tries.length; i++) {
            try {
              await track.applyConstraints(tries[i]);
              return z;
            } catch (e) {
              console.debug("track zoom", i, e);
            }
          }
        }
      }

      if (scanner && typeof scanner.applyVideoConstraints === "function") {
        const tries = [
          { advanced: [{ zoom: TARGET_CAMERA_ZOOM }] },
          { zoom: TARGET_CAMERA_ZOOM },
        ];
        for (let i = 0; i < tries.length; i++) {
          try {
            await scanner.applyVideoConstraints(tries[i]);
            return TARGET_CAMERA_ZOOM;
          } catch (e) {
            console.debug("scanner zoom", i, e);
          }
        }
      }

      return null;
    }

    async function startCamera() {
      if (isScanning) return;
      if (typeof Html5Qrcode === "undefined") {
        showStatus(scanStatus, "Scanner library not loaded. Check connection and reload.", "err");
        return;
      }
      if (!window.isSecureContext) {
        showStatus(
          scanStatus,
          "Camera needs HTTPS. Run serve-https.py and open https://YOUR-PC-IP:8443/",
          "err"
        );
        return;
      }

      hideStatus(scanStatus);
      btnStart.disabled = true;
      scannerWrap.classList.remove("hidden");
      showStatus(scanStatus, "Starting camera…", "info");

      try {
        scanner = new Html5Qrcode("reader", { verbose: false });
        const formatsToSupport = [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
        ];

        const config = {
          fps: 15,
          formatsToSupport,
          disableFlip: false,
        };
        const attempts = [
          buildCameraRequest("environment"),
          buildCameraRequest("user"),
          { facingMode: "environment" },
          { facingMode: "user" },
        ];
        let err = null;

        for (let i = 0; i < attempts.length; i++) {
          try {
            await scanner.start(attempts[i], config, onScanSuccess, function () {});
            err = null;
            break;
          } catch (e) {
            err = e;
            try {
              await scanner.stop();
              await scanner.clear();
            } catch (ignore) {}
            clearReaderElement();
            if (i < attempts.length - 1) {
              scanner = new Html5Qrcode("reader", { verbose: false });
            }
          }
        }
        if (err) throw err;

        isScanning = true;

        await applyPreferredZoom();
        startAutoScan();

        btnStart.classList.add("hidden");
        btnCapture.classList.remove("hidden");
        btnStop.classList.remove("hidden");
        showStatus(
          scanStatus,
          "Aim the tag in the preview — it should add automatically, or tap Scan now.",
          "ok"
        );
      } catch (e) {
        console.error(e);
        await stopCamera();
        showStatus(scanStatus, "Camera error: " + (e.message || e), "err");
      } finally {
        if (!isScanning) btnStart.disabled = false;
      }
    }

    async function stopCamera() {
      stopAutoScan();
      if (scanner) {
        try {
          if (isScanning) await scanner.stop();
          await scanner.clear();
        } catch (e) {
          console.warn(e);
        }
      }
      scanner = null;
      isScanning = false;
      clearReaderElement();
      scannerWrap.classList.add("hidden");
      btnStart.disabled = false;
      btnStart.classList.remove("hidden");
      btnCapture.classList.add("hidden");
      btnStop.classList.add("hidden");
    }

    btnStart.addEventListener("click", function () {
      void unlockShutterAudio();
      void startCamera();
    });
    btnCapture.addEventListener("click", captureAndScan);
    btnStop.addEventListener("click", stopCamera);

    btnAddManual.addEventListener("click", function () {
      if (addCode(manualCode.value)) manualCode.value = "";
    });

    manualCode.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        if (addCode(manualCode.value)) manualCode.value = "";
      }
    });

    schoolName.addEventListener("change", saveSession);
    schoolName.addEventListener("blur", saveSession);
    roomName.addEventListener("change", saveSession);
    roomName.addEventListener("blur", saveSession);

    btnCopy.addEventListener("click", async function () {
      if (!codes.length) {
        showStatus(exportStatus, "List is empty.", "warn");
        return;
      }
      try {
        await copyText(buildExportText());
        showStatus(exportStatus, "Copied full report — paste into Notepad, Excel, or email.", "ok");
      } catch (e) {
        showStatus(exportStatus, "Copy failed. Use Download .txt instead.", "err");
      }
    });

    btnDownload.addEventListener("click", function () {
      if (!codes.length) {
        showStatus(exportStatus, "List is empty.", "warn");
        return;
      }
      const blob = new Blob([buildExportText()], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = safeFilename();
      a.click();
      URL.revokeObjectURL(a.href);
      showStatus(exportStatus, "Download started — open the file on your computer.", "ok");
    });

    btnShare.addEventListener("click", async function () {
      if (!codes.length) {
        showStatus(exportStatus, "List is empty.", "warn");
        return;
      }
      const text = buildExportText();
      if (navigator.share) {
        try {
          await navigator.share({
            title: "Device barcode list",
            text: text,
          });
          showStatus(exportStatus, "Shared.", "ok");
          return;
        } catch (e) {
          if (e.name === "AbortError") return;
        }
      }
      try {
        await copyText(text);
        showStatus(exportStatus, "Share not available — list copied to clipboard instead.", "ok");
      } catch (e) {
        showStatus(exportStatus, "Use Download .txt or Email.", "warn");
      }
    });

    btnEmail.addEventListener("click", function () {
      if (!codes.length) {
        showStatus(exportStatus, "List is empty.", "warn");
        return;
      }
      const text = buildExportText();
      if (text.length > 1800) {
        showStatus(
          exportStatus,
          "List is long for email — use Download or Share instead.",
          "warn"
        );
        return;
      }
      const subject = encodeURIComponent("Barcodes: " + exportSubjectLabel());
      const body = encodeURIComponent(text);
      window.location.href = "mailto:?subject=" + subject + "&body=" + body;
      showStatus(exportStatus, "Opening Mail — send to yourself to open on a PC.", "ok");
    });

    btnClear.addEventListener("click", function () {
      if (codes.length && !confirm("Clear all " + codes.length + " scanned codes?")) return;
      codes = [];
      saveSession();
      renderList();
      hideStatus(exportStatus);
      showStatus(scanStatus, "List cleared.", "info");
    });

    btnUndo.addEventListener("click", function () {
      if (!codes.length) return;
      const removed = codes.pop();
      saveSession();
      renderList();
      showStatus(scanStatus, "Removed: " + removed, "info");
    });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden && isScanning) stopCamera();
    });

    loadSession();
    if (!schoolName.value.trim()) schoolName.value = DEFAULT_SCHOOL;
    renderList();
    const versionLabel = "v" + APP_VERSION;
    const appVersionBadge = document.getElementById("appVersionBadge");
    const appVersionEl = document.getElementById("appVersion");
    if (appVersionBadge) appVersionBadge.textContent = versionLabel;
    if (appVersionEl) appVersionEl.textContent = APP_VERSION;

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
